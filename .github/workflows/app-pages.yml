name: Deploy app to GitHub Pages

# Publishes one Pages artifact: the app at /<repo>/.
# Runs on every push to main that touches the app. Failing tests or a failing build stop the deploy.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Assemble site
        run: |
          mkdir site
          cp -R app/dist/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
